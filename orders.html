<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Order - ClubAd</title>

<!-- FontAwesome & Custom CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
/* Base structural styles */
body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; }
.dashboard { display: flex; }

/* SIDEBAR */
.sidebar { width: 250px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); height: 100vh; padding: 20px; position: fixed; z-index: 100; }
.sidebar h2 { color: #38bdf8; }
.sidebar a { display: block; color: #ccc; padding: 12px; margin: 10px 0; text-decoration: none; border-radius: 10px; transition: 0.3s; }
.sidebar a:hover { background: rgba(255,255,255,0.1); color: #fff; }

/* MAIN */
.main { margin-left: 270px; padding: 20px; width: 100%; max-width: 1200px;}
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;}
.header h1 { margin: 0; }

/* FORM */
.form-box { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);}
.form-section-title { font-size: 14px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 5px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 20px; margin-bottom: 25px;}

.input-group { display: flex; flex-direction: column; gap: 5px; }
.input-group label { font-size: 12px; color: #94a3b8; font-weight: 600; }
input, select, textarea { width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; box-sizing: border-box; font-size: 14px; transition: 0.3s;}
input:focus, select:focus { border-color: #38bdf8; background: rgba(0,0,0,0.5); outline: none;}
input:read-only { background: rgba(255,255,255,0.02); color: #cbd5e1; border-color: transparent;}

/* SUMMARY BOX */
.summary-container { display: flex; gap: 20px; align-items: flex-end; }
.summary-box { flex: 1; background: rgba(15, 23, 42, 0.8); border: 1px solid #38bdf8; padding: 20px; border-radius: 12px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 5px 15px rgba(56, 189, 248, 0.1);}
.summary-item { text-align: center; }
.summary-item p { margin: 0; font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
.summary-item h2 { margin: 5px 0 0 0; font-size: 24px; color: #fff; }
.summary-item .highlight { color: #38bdf8; font-size: 28px; }

button.btn-primary { padding: 15px 30px; border: none; border-radius: 10px; background: #22c55e; color: #fff; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 10px; height: 100%;}
button.btn-primary:hover { transform: scale(1.02); background: #16a34a; box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2); }

/* TABLE */
.table-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; overflow-x: auto; border: 1px solid rgba(255,255,255,0.05);}
table { width: 100%; border-collapse: collapse; white-space: nowrap; }
th, td { padding: 15px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
th { color: #94a3b8; background: rgba(0,0,0,0.2); font-size: 13px; text-transform: uppercase;}
.badge-id { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid rgba(56, 189, 248, 0.3);}
.badge-status { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
.status-paid { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3);}
.status-pending { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);}

@media(max-width:768px){
    .sidebar{display:none;}
    .main{margin-left:0;}
    .summary-container { flex-direction: column; }
    button.btn-primary { width: 100%; justify-content: center; padding: 20px;}
}
</style>
</head>

<body>

<div class="dashboard">

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>ClubAd</h2>
    <a href="index.html"><i class="fa fa-home"></i> Dashboard</a>
    <a href="services.html"><i class="fa fa-cogs"></i> Services</a>
    <a href="customers.html"><i class="fa fa-users"></i> Customers</a>
    <a href="orders.html"><i class="fa fa-plus"></i> New Order</a>
    <a href="invoice.html"><i class="fa fa-file-invoice"></i> Invoice</a>
    <a href="reports.html"><i class="fa fa-chart-line"></i> Reports</a>
    <a href="settings.html"><i class="fa fa-gear"></i> Settings</a>
</div>

<!-- MAIN -->
<div class="main">

<div class="header">
    <h1>Create New Order</h1>
    <span style="color: #94a3b8; font-size: 14px;">Date: <b style="color: #fff;" id="currentDateDisplay"></b></span>
</div>

<div class="form-box">
    
    <!-- Hidden Tracking IDs -->
    <input type="hidden" id="customerId">
    <input type="hidden" id="serviceId">

    <!-- CUSTOMER SECTION -->
    <h3 class="form-section-title"><i class="fa fa-user"></i> 1. Client Details</h3>
    <div class="form-grid">
        <div class="input-group">
            <label>Link Existing Customer Profile</label>
            <select id="customerSelect" onchange="fillCustomer()"></select>
        </div>
        <div class="input-group">
            <label>Customer Name (Required)</label>
            <input type="text" id="customerName" placeholder="Enter name manually or select above">
        </div>
        <div class="input-group">
            <label>Mobile Number</label>
            <input type="text" id="customerMobile" placeholder="Contact number">
        </div>
    </div>

    <!-- SERVICE SECTION -->
    <h3 class="form-section-title"><i class="fa fa-cogs"></i> 2. Service & Pricing Details</h3>
    <div class="form-grid">
        <div class="input-group">
            <label>Select Service Catalog Item</label>
            <select id="serviceSelect" onchange="fillService()"></select>
        </div>
        <div class="input-group">
            <label>Service Description</label>
            <input type="text" id="serviceName" placeholder="What service is being provided?">
        </div>
    </div>
    
    <div class="form-grid">
        <div class="input-group">
            <label>Base Cost (₹)</label>
            <input type="number" id="baseCost" placeholder="0.00">
        </div>
        <div class="input-group">
            <label>Service Charge (₹)</label>
            <input type="number" id="serviceCharge" placeholder="0.00">
        </div>
        <div class="input-group">
            <label>GST %</label>
            <input type="number" id="gst" placeholder="0">
        </div>
        <div class="input-group">
            <label>Extra Charges (₹)</label>
            <input type="number" id="extra" placeholder="0.00">
        </div>
        <div class="input-group">
            <label>Discount (₹) (-)</label>
            <input type="number" id="discount" placeholder="0.00">
        </div>
    </div>

    <!-- PAYMENT SECTION -->
    <h3 class="form-section-title"><i class="fa fa-wallet"></i> 3. Payment Collection</h3>
    <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <div class="input-group">
            <label>Advance / Amount Paid Now (₹)</label>
            <input type="number" id="advance" placeholder="0.00" style="border-color: #22c55e;">
        </div>
        <div class="input-group">
            <label>Payment Mode</label>
            <select id="paymentMode">
                <option>Cash</option>
                <option>UPI / QR</option>
                <option>Bank Transfer</option>
                <option>Card</option>
            </select>
        </div>
    </div>

    <!-- SUMMARY -->
    <div class="summary-container">
        <div class="summary-box">
            <div class="summary-item">
                <p>Gross Total</p>
                <h2>₹<span id="displayTotal">0.00</span></h2>
            </div>
            <div class="summary-item">
                <p>Balance Pending</p>
                <h2 class="highlight">₹<span id="displayBalance">0.00</span></h2>
            </div>
        </div>
        <button class="btn-primary" onclick="saveOrder()"><i class="fa fa-check-circle"></i> Complete & Save Order</button>
    </div>

</div>

<!-- RECENT ORDERS CONFIRMATION TABLE -->
<div class="table-box">
    <h3 style="margin: 0 0 15px 0; font-size: 16px; color: #fff;">Orders Created Today</h3>
    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Time</th>
                <th>Customer</th>
                <th>Service</th>
                <th>Total (₹)</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="recentTable">
            <!-- Data populated dynamically -->
        </tbody>
    </table>
</div>

</div>
</div>

<script>
document.getElementById("currentDateDisplay").innerText = new Date().toLocaleDateString();

// --- AUTO-ID GENERATOR LOGIC ---
function generateOrderId(ordersArray) {
    if(!ordersArray || ordersArray.length === 0) return "ORD-1001";
    let maxId = 1000;
    ordersArray.forEach(o => {
        if(o.id && o.id.startsWith("ORD-")) {
            let num = parseInt(o.id.split("-")[1]);
            if(!isNaN(num) && num > maxId) maxId = num;
        }
    });
    return "ORD-" + (maxId + 1);
}

// LOAD DROPDOWNS WITH IDs
function loadDropdowns(){
    let customers = JSON.parse(localStorage.getItem("customers")) || [];
    let services = JSON.parse(localStorage.getItem("services")) || [];

    let cSelect = document.getElementById("customerSelect");
    let sSelect = document.getElementById("serviceSelect");

    cSelect.innerHTML = "<option value=''>-- Create New or Select Existing --</option>";
    sSelect.innerHTML = "<option value=''>-- Create Custom or Select Catalog --</option>";

    // Reverse arrays to show newest profiles first
    customers.map((c, i) => { c.originalIndex = i; return c; }).reverse().forEach(c => {
        let cId = c.id || "CUST-LEGACY";
        cSelect.innerHTML += `<option value="${c.originalIndex}">[${cId}] ${c.name} - ${c.mobile || "No Mobile"}</option>`;
    });

    services.map((s, i) => { s.originalIndex = i; return s; }).reverse().forEach(s => {
        let sId = s.id || "SRV-LEGACY";
        sSelect.innerHTML += `<option value="${s.originalIndex}">[${sId}] ${s.name} (₹${parseFloat(s.total||0).toFixed(0)})</option>`;
    });
}

// FILL CUSTOMER DETAILS
function fillCustomer(){
    let val = document.getElementById("customerSelect").value;
    if(val === "") {
        document.getElementById("customerId").value = "";
        document.getElementById("customerName").value = "";
        document.getElementById("customerMobile").value = "";
        return;
    }

    let c = JSON.parse(localStorage.getItem("customers"))[val];
    if(c) {
        document.getElementById("customerId").value = c.id || "CUST-LEGACY";
        document.getElementById("customerName").value = c.name || "";
        document.getElementById("customerMobile").value = c.mobile || "";
    }
}

// FILL SERVICE DETAILS
function fillService(){
    let val = document.getElementById("serviceSelect").value;
    if(val === "") {
        document.getElementById("serviceId").value = "";
        document.getElementById("serviceName").value = "";
        document.getElementById("baseCost").value = "";
        document.getElementById("serviceCharge").value = "";
        document.getElementById("gst").value = "";
        calculateTotal();
        return;
    }

    let s = JSON.parse(localStorage.getItem("services"))[val];
    if(s) {
        document.getElementById("serviceId").value = s.id || "SRV-LEGACY";
        document.getElementById("serviceName").value = s.name || "";
        document.getElementById("baseCost").value = s.baseCost || 0;
        document.getElementById("serviceCharge").value = s.serviceCharge || 0;
        document.getElementById("gst").value = s.gst || 0;
        calculateTotal();
    }
}

// LIVE TOTAL CALCULATION
function calculateTotal(){
    let base = parseFloat(document.getElementById("baseCost").value) || 0;
    let charge = parseFloat(document.getElementById("serviceCharge").value) || 0;
    let gstVal = parseFloat(document.getElementById("gst").value) || 0;
    let extraVal = parseFloat(document.getElementById("extra").value) || 0;
    let discountVal = parseFloat(document.getElementById("discount").value) || 0;
    let adv = parseFloat(document.getElementById("advance").value) || 0;

    let subtotal = base + charge + extraVal;
    let gstAmt = subtotal * (gstVal / 100);
    let total = subtotal + gstAmt - discountVal;
    let balance = total - adv;

    // Safety fallback
    if(balance < 0) balance = 0;

    document.getElementById("displayTotal").innerText = total.toFixed(2);
    document.getElementById("displayBalance").innerText = balance.toFixed(2);
}

// Bind live calculation events
["baseCost", "serviceCharge", "gst", "extra", "discount", "advance"].forEach(id => {
    let el = document.getElementById(id);
    if(el) el.addEventListener("input", calculateTotal);
});

// SAVE ORDER TO DATABASE
function saveOrder(){
    let customerName = document.getElementById("customerName").value.trim();
    let serviceName = document.getElementById("serviceName").value.trim();

    if(!customerName || !serviceName) {
        alert("Please ensure both Customer Name and Service Description are filled out.");
        return;
    }

    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    let newOrderId = generateOrderId(orders);
    
    // Safety check for calculated values
    calculateTotal(); 
    let finalTotal = parseFloat(document.getElementById("displayTotal").innerText) || 0;
    let finalAdvance = parseFloat(document.getElementById("advance").value) || 0;

    let data = {
        id: newOrderId,
        date: new Date().toISOString(),
        
        // Relational IDs
        customerId: document.getElementById("customerId").value || null,
        serviceId: document.getElementById("serviceId").value || null,
        
        customerName: customerName,
        customerMobile: document.getElementById("customerMobile").value.trim(),
        serviceName: serviceName,
        
        baseCost: parseFloat(document.getElementById("baseCost").value) || 0,
        serviceCharge: parseFloat(document.getElementById("serviceCharge").value) || 0,
        gst: parseFloat(document.getElementById("gst").value) || 0,
        extra: parseFloat(document.getElementById("extra").value) || 0,
        discount: parseFloat(document.getElementById("discount").value) || 0,
        
        total: finalTotal,
        advance: finalAdvance,
        paymentMode: document.getElementById("paymentMode").value
    };

    orders.push(data);
    localStorage.setItem("orders", JSON.stringify(orders));

    // Reset Form
    document.querySelectorAll(".form-grid input").forEach(el => el.value = "");
    document.getElementById("customerSelect").selectedIndex = 0;
    document.getElementById("serviceSelect").selectedIndex = 0;
    document.getElementById("paymentMode").selectedIndex = 0;
    calculateTotal();

    // Reload the mini-table to show success
    loadTodayOrders();
    
    // Optional alert
    alert(`Order ${newOrderId} saved successfully!`);
}

// LOAD MINI TABLE (Today's Orders)
function loadTodayOrders(){
    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    let table = document.getElementById("recentTable");
    table.innerHTML = "";

    let todayStr = new Date().toDateString();
    
    // Filter for today's orders and reverse to show newest at top
    let todayOrders = orders.filter(o => {
        if(!o.date) return false;
        return new Date(o.date).toDateString() === todayStr;
    }).reverse();

    if(todayOrders.length === 0) {
        table.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888; padding: 30px;">No orders have been created today yet.</td></tr>`;
        return;
    }

    todayOrders.forEach(o => {
        let d = new Date(o.date);
        let timeStr = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        let total = parseFloat(o.total) || 0;
        let adv = parseFloat(o.advance) || 0;
        let bal = total - adv;
        
        let statusHtml = bal <= 0 
            ? `<span class="badge-status status-paid">Paid</span>` 
            : `<span class="badge-status status-pending">Pending (₹${bal.toFixed(2)})</span>`;

        table.innerHTML += `
            <tr>
                <td><span class="badge-id">${o.id || "ORD-LEGACY"}</span></td>
                <td style="color: #94a3b8;">${timeStr}</td>
                <td style="font-weight: bold;">${o.customerName || "-"}</td>
                <td>${o.serviceName || "-"}</td>
                <td style="font-weight: bold; color: #38bdf8;">₹${total.toFixed(2)}</td>
                <td>${statusHtml}</td>
            </tr>
        `;
    });
}

// INIT
loadDropdowns();
loadTodayOrders();
</script>

</body>
</html>
